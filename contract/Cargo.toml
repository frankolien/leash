[package]
name = "leash"
version = "0.1.0"
edition = "2021"
description = "A bounded account for AI agents on NEAR: spending limits enforced by a contract, not a promise"
repository = "https://github.com/frankolien/leash"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }
near-workspaces = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
ed25519-dalek = "2"
bs58 = "0.5"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
