[package]
name = "mock-ft"
version = "0.1.0"
edition = "2021"
description = "A NEP-141 token with a mint method, standing in for USDC in the Leash sandbox tests"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"
near-contract-standards = "5.29"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
